name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Release calls this workflow, so nothing ships without passing the same gates
  # that a pull request has to pass.
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    # The test double claims to run on Linux, Windows and macOS with no Docker.
    # A claim like that is only true if CI proves it on every push.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets --locked
      # --all-targets skips doctests, and every crate README is a doctest.
      - run: cargo test --workspace --doc --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked

  msrv:
    name: MSRV
    # Section 8 makes the MSRV part of the contract, so it is verified with that
    # exact toolchain rather than assumed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  rules:
    name: dependency rules
    # Rules 1, 2 and 3 from section 4, plus the no_std floor from section 9.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask check-layering
      - run: cargo xtask check-no-std
      - run: cargo xtask check-isolated

  features:
    name: feature powerset
    # The Rust-specific half of Rule 3. Inside a workspace, cargo unifies features
    # across members, so a crate can compile only because a sibling turned something
    # on. This is what catches that before a consumer does.
    #
    # No --locked: cargo-hack rewrites manifests to strip dev-dependencies, which
    # makes the committed lockfile legitimately out of date for the duration.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
      - run: cargo hack check --workspace --feature-powerset --no-dev-deps

  public-api:
    name: public API surface
    # Section 5. Any change to the public surface fails until the committed snapshot
    # is updated, which makes the API change a visible line in the pull request.
    #
    # The --omit flags matter for more than brevity. Auto-trait, blanket and derived
    # impls are generated by the compiler, so they change when the *toolchain*
    # changes rather than when our API does — and this job runs on a floating
    # nightly. Tracking them would turn a rustc release into a red build with no
    # cause in this repository.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-public-api
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate and diff
        run: |
          set -euo pipefail
          status=0
          for crate in kvlite-api kvlite-resp kvlite-core kvlite-server kvlite-testing; do
            snapshot="crates/$crate/public-api.txt"
            cargo public-api --package "$crate" \
              --omit blanket-impls,auto-trait-impls,auto-derived-impls \
              > /tmp/actual.txt
            if ! diff -u "$snapshot" /tmp/actual.txt; then
              echo "::error::$crate's public API changed. Regenerate with: cargo xtask public-api"
              status=1
            fi
          done
          exit $status

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

# Not here, on purpose:
#
#   cargo-semver-checks has nothing to compare against until the first release is on
#   crates.io. Adding it now would mean a permanently red job, and a CI signal people
#   learn to ignore is worse than no signal. It goes in with the first publish; see
#   the Phase 1 checklist in kvlite-packaging.md.
#
#   Fuzzing lives in fuzz.yml on a schedule rather than here. Sixty seconds per push
#   finds almost nothing, and it would gate every merge on a toolchain this project
#   does not otherwise need. The properties the fuzzer checks are also pinned as
#   ordinary unit tests, so a regression still fails this workflow.
