name: Release

# Runs on tags only. Unlike ci.yml this cannot be rehearsed locally end to end, so
# treat the first tag as a dry run and expect to fix something.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to crates.io? Type "yes". This cannot be undone.'
        required: true
        default: "no"

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Nothing ships unless the same checks that gate a pull request also pass here.
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish to crates.io
    needs: verify

    # Deliberately NOT triggered by a tag. A crates.io publish cannot be undone — a
    # version can be yanked but never removed, and the name is claimed forever — so
    # it is too consequential to hang off a `git push --tags` that somebody might
    # make for any number of reasons. Tagging builds binaries and cuts a GitHub
    # release; publishing is a separate, deliberate act.
    #
    # Run it from the Actions tab: "Release" -> "Run workflow" -> publish: yes.
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'yes'

    # Scopes CARGO_REGISTRY_TOKEN to this job. Add a required reviewer to the
    # `crates-io` environment in repository settings and the publish also needs a
    # human to approve it.
    environment: crates-io

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Dependency order matters: a crate cannot be published before the crates it
      # depends on are on the registry. `--locked` is what makes the published
      # artifact reproducible.
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          for crate in kvlite-api kvlite-resp kvlite-core kvlite-server kvlite-testing kvlite; do
            echo "::group::publishing $crate"
            cargo publish --package "$crate" --locked
            # The index takes a moment to catch up, and the next crate in the chain
            # cannot resolve this one until it has.
            sleep 30
            echo "::endgroup::"
          done

  binaries:
    name: ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, cross: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, cross: true }
          - { os: macos-latest, target: aarch64-apple-darwin, cross: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, cross: false }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # musl needs a linker the runner does not ship. The Apple and Windows targets
      # are native to their runners and need nothing — `cross` would be actively
      # wrong there, since it builds through a Linux container.
      - name: Install musl toolchain
        if: matrix.cross
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # panic=abort belongs here rather than in [profile.release]: cargo profiles are
      # workspace-scoped, and setting it there would break `cargo test --release`.
      # --remap-path-prefix keeps a builder's directory layout out of backtraces.
      - name: Build
        shell: bash
        run: cargo build --release --locked --package kvlite --target ${{ matrix.target }}
        env:
          RUSTFLAGS: -C panic=abort --remap-path-prefix=${{ github.workspace }}=/kvlite

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          suffix=""
          [ "${{ runner.os }}" = "Windows" ] && suffix=".exe"
          cp "target/${{ matrix.target }}/release/kvlite$suffix" \
             "dist/kvlite-${{ matrix.target }}$suffix"
          ls -l dist

      - name: Attest provenance
        # crates.io cannot sign packages. This is what we can attest instead, and the
        # release notes say so plainly rather than implying the crates are signed.
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  sbom:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx
      - run: cargo cyclonedx --format json --all
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: "**/*.cdx.json"
