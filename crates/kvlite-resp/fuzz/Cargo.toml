[package]
name = "kvlite-resp-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

# Deliberately outside the workspace. A fuzz target needs nightly and `cargo-fuzz`,
# and nothing about the real build should depend on either being installed.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
kvlite-resp = { path = ".." }

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[profile.release]
debug = true
